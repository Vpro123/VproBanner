name: VPro - tu dong nhan APK moi
on:
  workflow_dispatch:
  release:
    types: [published, edited, released, prereleased, deleted]
  push:
    branches: [main]
    paths:
      - '**.apk'
      - '**.APK'
      - 'scripts/build_update_feed.py'
      - '.github/workflows/vpro-update-feed.yml'
permissions:
  contents: write
concurrency:
  group: vpro-update-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Tao thong tin cap nhat tu APK da dang
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_update_feed.py
      - name: Luu thong tin de VPro tu nhan
        run: |
          if git diff --quiet -- update-live.json && git ls-files --error-unmatch update-live.json >/dev/null 2>&1; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update-live.json
          git commit -m 'Refresh VPro APK update metadata'
          git push origin HEAD:main

