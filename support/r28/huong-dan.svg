<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc"><title id="title">Hướng dẫn VPro R28</title><desc id="desc">Ba minh họa: lưu tọa độ, di chuyển qua nhiều điểm trên bản đồ, liên hệ VPro và quyền riêng tư.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.card{fill:white;stroke:#dbe7ec;stroke-width:2}.button{fill:#eaf5fa;stroke:#bfd7e1;stroke-width:1.5}.small{fill:#59717d}</style><rect width="1200" height="980" fill="#f1f6f9"/><rect width="1200" height="177" fill="#0a293b"/><text x="42" y="48" font-size="17" fill="#84d5e3" font-weight="700">VPRO  /  HƯỚNG DẪN R28</text><text x="42" y="96" font-size="38" fill="white" font-weight="700">Chọn điểm. Lưu nhanh. Dễ liên hệ.</text><text x="42" y="140" font-size="18" fill="#cee6ee" font-weight="400">Hình minh họa thao tác • không phải ảnh chụp kiểm thử trên điện thoại</text><rect x="32" y="205" width="356" height="662" rx="22" class="card"/><circle cx="65" cy="240" r="16" fill="#17758b"/><text x="59" y="246" font-size="17" fill="white" font-weight="700">1</text><rect x="422" y="205" width="356" height="662" rx="22" class="card"/><circle cx="455" cy="240" r="16" fill="#17758b"/><text x="449" y="246" font-size="17" fill="white" font-weight="700">2</text><rect x="812" y="205" width="356" height="662" rx="22" class="card"/><circle cx="845" cy="240" r="16" fill="#17758b"/><text x="839" y="246" font-size="17" fill="white" font-weight="700">3</text><text x="94" y="247" font-size="21" fill="#123847" font-weight="700">Lưu tọa độ đã chọn</text><text x="54" y="285" font-size="16" fill="#193c4a" font-weight="400">Chạm điểm trên Maps, rồi chọn:</text><rect x="54" y="309" width="312" height="45" rx="10" class="button"/><text x="84" y="338" font-size="19" fill="#176478" font-weight="700">Lưu tọa độ điểm này</text><text x="54" y="395" font-size="15" fill="#647a84" font-weight="400">Tên điểm</text><rect x="54" y="407" width="312" height="48" rx="8" fill="#f3f7f9"/><text x="68" y="438" font-size="17" fill="#193c4a" font-weight="400">Cổng đón khách đã kiểm tra</text><text x="54" y="492" font-size="15" fill="#647a84" font-weight="400">Vĩ độ</text><rect x="54" y="503" width="312" height="43" rx="8" fill="#f3f7f9"/><text x="68" y="532" font-size="18" fill="#193c4a" font-weight="400">16.000000</text><text x="54" y="580" font-size="15" fill="#647a84" font-weight="400">Kinh độ</text><rect x="54" y="592" width="312" height="43" rx="8" fill="#f3f7f9"/><text x="68" y="621" font-size="18" fill="#193c4a" font-weight="400">108.000000</text><rect x="229" y="668" width="136" height="45" rx="10" fill="#17758b"/><text x="278" y="697" font-size="19" fill="white" font-weight="700">Lưu</text><text x="54" y="756" font-size="16" fill="#193c4a" font-weight="400">Đặt tên tùy ý, giữ hoặc sửa tọa độ.</text><text x="54" y="788" font-size="16" fill="#193c4a" font-weight="400">Điểm được thêm vào danh sách lưu.</text><text x="54" y="826" font-size="14" fill="#6c7b83" font-weight="400">Tọa độ trên hình chỉ là ví dụ.</text><text x="484" y="247" font-size="21" fill="#123847" font-weight="700">Tuyến A → B → C…</text><text x="444" y="285" font-size="15" fill="#193c4a" font-weight="400">Thêm điểm trên Maps hoặc tìm địa chỉ.</text><rect x="444" y="307" width="312" height="237" rx="14" fill="#e6f3ee"/><path d="M459 330L735 517 M479 535L693 310 M445 420L756 370 M444 488L747 443" fill="none" stroke="white" stroke-width="19"/><path d="M488 487L568 450L606 363L710 345" fill="none" stroke="#168ca0" stroke-width="6" stroke-linecap="round"/><circle cx="488" cy="487" r="17" fill="#176b82" stroke="white" stroke-width="3"/><text x="482" y="493" font-size="18" fill="white" font-weight="700">A</text><circle cx="568" cy="450" r="17" fill="#176b82" stroke="white" stroke-width="3"/><text x="562" y="456" font-size="18" fill="white" font-weight="700">B</text><circle cx="606" cy="363" r="17" fill="#176b82" stroke="white" stroke-width="3"/><text x="600" y="369" font-size="18" fill="white" font-weight="700">C</text><circle cx="710" cy="345" r="17" fill="#176b82" stroke="white" stroke-width="3"/><text x="704" y="351" font-size="18" fill="white" font-weight="700">D</text><text x="444" y="580" font-size="18" fill="#193c4a" font-weight="700">Tốc độ: 40 km/h</text><path d="M452 611H742" stroke="#c9dfe8" stroke-width="7" stroke-linecap="round"/><path d="M452 611H570" stroke="#178ca0" stroke-width="7" stroke-linecap="round"/><circle cx="570" cy="611" r="11" fill="#176b82"/><text x="444" y="651" font-size="17" fill="#193c4a" font-weight="400">☑  Lặp đi/về đến khi dừng</text><rect x="444" y="670" width="312" height="45" rx="10" fill="#17758b"/><text x="536" y="699" font-size="18" fill="white" font-weight="700">Áp dụng tuyến</text><text x="444" y="756" font-size="16" fill="#193c4a" font-weight="400">Đổi tốc độ ngay khi đang chạy.</text><text x="444" y="787" font-size="15" fill="#193c4a" font-weight="400">Tuyến mới chạy sau khi bấm Áp dụng.</text><text x="444" y="826" font-size="14" fill="#6c7b83" font-weight="400">Đây là lộ trình mô phỏng GPS.</text><text x="874" y="247" font-size="21" fill="#123847" font-weight="700">Hỗ trợ ngay trong app</text><text x="834" y="285" font-size="16" fill="#193c4a" font-weight="400">Mở biểu tượng dưới nút cập nhật.</text><rect x="834" y="313" width="312" height="47" rx="10" class="button"/><text x="851" y="343" font-size="18" fill="#176478" font-weight="700">Hướng dẫn sử dụng</text><rect x="834" y="374" width="312" height="47" rx="10" class="button"/><text x="851" y="404" font-size="18" fill="#176478" font-weight="700">Hỏi trợ lý AI</text><rect x="834" y="435" width="312" height="47" rx="10" class="button"/><text x="851" y="465" font-size="18" fill="#176478" font-weight="700">Liên hệ VPro trực tiếp</text><rect x="834" y="496" width="312" height="47" rx="10" class="button"/><text x="851" y="526" font-size="18" fill="#176478" font-weight="700">Chat cộng đồng</text><rect x="834" y="574" width="312" height="121" rx="13" fill="#fff7e9"/><text x="850" y="604" font-size="16" fill="#8c5617" font-weight="700">Bạn quyết định dữ liệu chia sẻ</text><text x="850" y="636" font-size="15" fill="#8c5617" font-weight="400">Tên máy và vị trí: mặc định tắt.</text><text x="850" y="666" font-size="14" fill="#8c5617" font-weight="400">Có thể tắt lại trong Quyền riêng tư.</text><text x="834" y="756" font-size="16" fill="#193c4a" font-weight="400">Chat riêng tách theo từng bản cài.</text><text x="834" y="787" font-size="16" fill="#193c4a" font-weight="400">Chat cộng đồng cần VPro duyệt.</text><text x="834" y="826" font-size="14" fill="#6c7b83" font-weight="400">Cần kết nối dịch vụ của VPro.</text><text x="42" y="915" font-size="18" fill="#4b6573" font-weight="400">VPro không có dữ liệu xác thực để dự đoán “điểm nổ” hoặc bảo đảm số cuốc xe.</text><text x="42" y="946" font-size="16" fill="#4b6573" font-weight="400">Hướng dẫn sử dụng • Vị trí mô phỏng không chứng minh vị trí thật của khách hoặc tài xế.</text></svg>